# Overrides para produccion. Se aplican encima de application.properties cuando
# el perfil "produccion" esta activo (SPRING_PROFILES_ACTIVE=produccion).
#
# Existe porque los defaults de application.properties estan pensados para
# trabajar comodo en local, y varios de ellos son malas ideas en un servidor
# publico.

# --- Logs ------------------------------------------------------------------
# En desarrollo mostramos cada consulta que genera Spring Data, que es utilisimo
# para aprender. En produccion no: llena el log de ruido, hace mas lento cada
# request, y publica la estructura interna de la base en un lugar donde no tiene
# por que estar.
#
# Con Mongo esto importa MAS que con Hibernate. El log de MongoTemplate en debug
# imprime la consulta con sus VALORES adentro, no con placeholders: un findByEmail
# deja el email en el log. Hibernate en debug imprimia el SQL con "?" y hacia
# falta subir otro logger aparte para ver los parametros.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=warn
logging.level.org.mongodb.driver=warn

# --- Errores ---------------------------------------------------------------
# Que ninguna respuesta de error incluya stacktrace ni detalle interno. Son los
# defaults de Spring Boot, pero preferimos dejarlo explicito y no depender de
# que un default no cambie en una version futura.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Indices ---------------------------------------------------------------
# Se dejan creandose al arrancar tambien en produccion. Es discutible: crear un
# indice bloquea la coleccion, y en una base grande eso es una sorpresa fea en
# medio de un deploy. Aca las colecciones son chicas (miles de documentos) y la
# alternativa seria crearlos a mano en Atlas, que es un paso manual que alguien
# se va a olvidar. Si algun dia la base crece, esto se apaga y los indices se
# crean aparte.
spring.data.mongodb.auto-index-creation=true
