# Overrides para produccion. Se aplican encima de application.properties cuando
# el perfil "produccion" esta activo (SPRING_PROFILES_ACTIVE=produccion).
#
# Existe porque los defaults de application.properties estan pensados para
# trabajar comodo en local, y varios de ellos son malas ideas en un servidor
# publico.

# --- Logs ------------------------------------------------------------------
# En desarrollo mostramos cada consulta que genera Hibernate, que es utilisimo
# para aprender. En produccion no: llena el log de ruido, hace mas lento cada
# request, y publica la estructura interna de la base en un lugar donde no tiene
# por que estar.
logging.level.org.hibernate.SQL=warn
spring.jpa.properties.hibernate.format_sql=false

# Nunca subir a TRACE el binder de parametros en produccion: ahi si se
# imprimen los VALORES de cada consulta, incluidos los hashes de contrasena.
logging.level.org.hibernate.orm.jdbc.bind=warn

# --- Errores ---------------------------------------------------------------
# Que ninguna respuesta de error incluya stacktrace ni detalle interno. Son los
# defaults de Spring Boot, pero preferimos dejarlo explicito y no depender de
# que un default no cambie en una version futura.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Esquema ---------------------------------------------------------------
# Redundante con el default, y a proposito: si alguien setea DDL_AUTO por error
# en las variables de Railway, esto lo pisa. Ademas ValidacionDeConfiguracion
# se niega a arrancar si termina siendo otra cosa.
spring.jpa.hibernate.ddl-auto=validate
