spring.application.name=gastos-compartidos

# --- Base de datos ---------------------------------------------------------
# Sintaxis ${VARIABLE:valor_por_defecto}: en local toma el default y arranca
# sin configurar nada; en Railway/Render las variables de entorno ganan.
# Asi no queda ninguna credencial de produccion hardcodeada en el repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gastos}
spring.datasource.username=${DB_USER:gastos}
spring.datasource.password=${DB_PASSWORD:gastos_local}

# --- JPA / Hibernate -------------------------------------------------------
# ddl-auto=update: Hibernate crea y modifica las tablas segun las entidades.
# Comodo para desarrollar, PELIGROSO en produccion (nunca borra ni corrige de
# verdad, y no deja historial). Antes del deploy migramos esto a Flyway.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# open-in-view=false: cierra la sesion de Hibernate al salir del servicio, en
# vez de mantenerla abierta durante toda la request. Con true, un getter lazy
# en el controlador dispara consultas invisibles (N+1). Con false explota de
# entrada y te obliga a traer los datos donde corresponde.
spring.jpa.open-in-view=false

# Ver el SQL que genera Hibernate mientras aprendemos. Apagar mas adelante.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# --- Autenticacion ---------------------------------------------------------
# El secreto firma los tokens: quien lo tenga puede emitir tokens validos para
# cualquier usuario. El default de abajo es SOLO para desarrollo y esta en el
# repo a la vista de todos.
# EN PRODUCCION HAY QUE SETEAR JWT_SECRETO con un valor random largo (sesion 5).
app.jwt.secreto=${JWT_SECRETO:secreto-de-desarrollo-NO-USAR-EN-PRODUCCION-esta-en-el-repo}
app.jwt.duracion-dias=${JWT_DURACION_DIAS:30}

# Sin este codigo nadie puede registrarse. Cambiarlo en produccion.
app.registro.codigo-invitacion=${CODIGO_INVITACION:nutrias}
app.grupo-por-defecto=${GRUPO_POR_DEFECTO:Casa}

# --- Zona horaria ----------------------------------------------------------
# Define donde cae el corte de mes. Railway y Render corren en UTC.
app.zona-horaria=${ZONA_HORARIA:America/Argentina/Buenos_Aires}
