spring.application.name=gastos-compartidos

# --- Base de datos ---------------------------------------------------------
# Una sola URI en vez de url + usuario + password: es como se configura Mongo.
# authSource=admin porque el usuario root de la imagen de Docker se crea en la
# base 'admin', no en 'gastos'. Sin eso la autenticacion falla con un mensaje
# que no ayuda nada.
#
# En produccion, MONGO_URI es la cadena que da Atlas (mongodb+srv://...), que
# incluye usuario, password y replica set. Ojo: lleva credenciales adentro, asi
# que va SIEMPRE por variable de entorno y nunca en el repo.
# OJO: es spring.mongodb.uri, NO spring.data.mongodb.uri.
#
# En Boot 4 la conexion se separo del mapeo: la URI vive en el modulo
# spring-boot-mongodb (prefijo spring.mongodb) y spring.data.mongodb quedo solo
# con lo de Spring Data. La propiedad vieja esta deprecada con nivel "error"
# desde 4.0.0, o sea que NO SE BINDEA Y NO AVISA: la app arranca, cae al default
# mongodb://localhost/test y falla con "Command createIndexes requires
# authentication", que no menciona en ningun lado que el problema es el nombre
# de la propiedad.
#
# Todo internet la sigue documentando como spring.data.mongodb.uri porque es lo
# correcto en Boot 3. Es la misma trampa que flyway-core contra
# spring-boot-starter-flyway.
spring.mongodb.uri=${MONGO_URI:mongodb://gastos:gastos_local@localhost:27017/gastos?authSource=admin}

# Que Spring Data cree los indices declarados con @Indexed y @CompoundIndex.
# Viene APAGADO por defecto desde Spring Boot 3, a proposito: crear un indice
# sobre una coleccion grande bloquea, y hacerlo al arrancar es una sorpresa fea
# en produccion. Aca la coleccion tiene miles de documentos, no millones, asi
# que el arranque automatico es lo correcto y ahorra un paso manual.
#
# Es lo mas parecido a Flyway que ofrece Mongo, y no se le parece en nada:
# crea indices, pero no valida que los documentos tengan la forma esperada.
spring.data.mongodb.auto-index-creation=true

# PLATA: que BigDecimal se guarde como Decimal128, el decimal exacto de BSON.
# Es el analogo de NUMERIC(12,2) de Postgres.
#
# El default es "unspecified", que guarda los BigDecimal como String: ordenan
# mal y no se pueden sumar en una agregacion. Como el resumen y el saldo suman
# con $sum ADENTRO de Mongo, dejarlo en el default no daria error -- daria
# totales silenciosamente equivocados.
#
# Boot 4 trae esto de fabrica, asi que no hacen falta conversores propios para
# los montos. Los de LocalDate si, y estan en ConfiguracionMongo.
spring.data.mongodb.representation.big-decimal=decimal128

# Ver las consultas que se generan mientras aprendemos. Es el equivalente de
# logging.level.org.hibernate.SQL que teniamos con Postgres.
# Lo apaga application-produccion.properties, NO este default.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=debug

# --- Autenticacion ---------------------------------------------------------
# El secreto firma los tokens: quien lo tenga puede emitir tokens validos para
# cualquier usuario. El default de abajo es SOLO para desarrollo y esta en el
# repo a la vista de todos.
# En produccion hay que setear JWT_SECRETO. Si no se setea, la app se niega a
# arrancar: ver ValidacionDeConfiguracion.
app.jwt.secreto=${JWT_SECRETO:secreto-de-desarrollo-NO-USAR-EN-PRODUCCION-esta-en-el-repo}
app.jwt.duracion-dias=${JWT_DURACION_DIAS:30}

# Sin este codigo nadie puede registrarse. Cambiarlo en produccion.
app.registro.codigo-invitacion=${CODIGO_INVITACION:nutrias}
app.grupo-por-defecto=${GRUPO_POR_DEFECTO:Casa}

# --- Zona horaria ----------------------------------------------------------
# Define donde cae el corte de mes. Railway corre en UTC, asi que sin esto un
# gasto de las 21:00 del 30 de septiembre en Buenos Aires contaria como octubre.
app.zona-horaria=${ZONA_HORARIA:America/Argentina/Buenos_Aires}

# --- Servidor --------------------------------------------------------------
# Railway inyecta el puerto por la variable PORT y espera que el proceso escuche
# ahi. En local no existe, y usa 8080.
server.port=${PORT:8080}

# Al recibir la senial de apagado, termina las requests en curso antes de morir.
# Railway reemplaza contenedores en cada deploy; sin esto, quien estuviera
# guardando un gasto en ese instante recibe una conexion cortada.
server.shutdown=graceful

# --- Actuator --------------------------------------------------------------
# Solo el health check. Por defecto expone bastante mas, y nada de eso tiene por
# que ser publico.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
