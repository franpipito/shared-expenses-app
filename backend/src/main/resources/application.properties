spring.application.name=gastos-compartidos

# --- Base de datos ---------------------------------------------------------
# Sintaxis ${VARIABLE:valor_por_defecto}: en local toma el default y arranca
# sin configurar nada; en Railway las variables de entorno ganan.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gastos}
spring.datasource.username=${DB_USER:gastos}
spring.datasource.password=${DB_PASSWORD:gastos_local}

# --- Migraciones -----------------------------------------------------------
# Flyway corre las migraciones de db/migration ANTES de que Hibernate mire nada.
# Guarda en flyway_schema_history que se aplico y cuando, mas un checksum de
# cada archivo: si alguien edita una migracion ya aplicada, la app no arranca.
spring.flyway.enabled=true

# --- JPA / Hibernate -------------------------------------------------------
# validate, no update: el esquema lo maneja Flyway y Hibernate solo verifica al
# arrancar que las entidades coincidan con las tablas. Si alguien agrega un
# campo a una entidad y se olvida la migracion, la app falla al arrancar en vez
# de romperse en la primera consulta que use esa columna.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# open-in-view=false: cierra la sesion de Hibernate al salir del servicio, en
# vez de mantenerla abierta durante toda la request. Con true, un getter lazy
# en el controlador dispara consultas invisibles (N+1). Con false explota de
# entrada y te obliga a traer los datos donde corresponde.
spring.jpa.open-in-view=false

# Ver el SQL que genera Hibernate mientras aprendemos.
# Lo apaga application-produccion.properties, NO este default: ojo con asumir
# que una variable de entorno va a estar seteada en el server.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# --- Autenticacion ---------------------------------------------------------
# El secreto firma los tokens: quien lo tenga puede emitir tokens validos para
# cualquier usuario. El default de abajo es SOLO para desarrollo y esta en el
# repo a la vista de todos.
# En produccion hay que setear JWT_SECRETO. Si no se setea, la app se niega a
# arrancar: ver ValidacionDeConfiguracion.
app.jwt.secreto=${JWT_SECRETO:secreto-de-desarrollo-NO-USAR-EN-PRODUCCION-esta-en-el-repo}
app.jwt.duracion-dias=${JWT_DURACION_DIAS:30}

# Sin este codigo nadie puede registrarse. Cambiarlo en produccion.
app.registro.codigo-invitacion=${CODIGO_INVITACION:nutrias}
app.grupo-por-defecto=${GRUPO_POR_DEFECTO:Casa}

# --- Zona horaria ----------------------------------------------------------
# Define donde cae el corte de mes. Railway corre en UTC, asi que sin esto un
# gasto de las 21:00 del 30 de septiembre en Buenos Aires contaria como octubre.
app.zona-horaria=${ZONA_HORARIA:America/Argentina/Buenos_Aires}

# --- Servidor --------------------------------------------------------------
# Railway inyecta el puerto por la variable PORT y espera que el proceso escuche
# ahi. En local no existe, y usa 8080.
server.port=${PORT:8080}

# Al recibir la senial de apagado, termina las requests en curso antes de morir.
# Railway reemplaza contenedores en cada deploy; sin esto, quien estuviera
# guardando un gasto en ese instante recibe una conexion cortada.
server.shutdown=graceful

# --- Actuator --------------------------------------------------------------
# Solo el health check. Por defecto expone bastante mas, y nada de eso tiene por
# que ser publico.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
