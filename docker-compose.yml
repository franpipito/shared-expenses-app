# Postgres local para desarrollo.
# Levantar:  docker compose up -d
# Apagar:    docker compose down        (los datos sobreviven, viven en el volumen)
# Borrar:    docker compose down -v     (elimina el volumen y con el los datos)
services:
  postgres:
    image: postgres:17-alpine
    container_name: gastos-postgres
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos_local
    ports:
      # 127.0.0.1 adelante, y no solo "5432:5432", que publica el puerto en
      # TODAS las interfaces de red. Con el binding abierto, cualquiera en la
      # misma red (un wifi de cafe, por ejemplo) puede conectarse a esta base
      # con el usuario y la contrasena que estan ahi abajo, a la vista en el
      # repo. Asi solo escucha en tu propia maquina.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
